@if (initialized()) {
<div class="list">
<app-toolbar><a routerLink="/article/new">{{ dict['BTN_NEW_ARTICLE'] }}</a></app-toolbar>
  @for (article of articles(); track article.id) {
  <article>
    <app-toolbar>
      <h2><a routerLink="/article/{{article.id}}">{{ article.title }}</a></h2>
      <div class="actions">
        <app-article-delete-button
          [article]="article"
          [refreshData]="loadArticles.bind(this)"
        />
        <app-article-edit-button [article]="article"/>
      </div>
    </app-toolbar>
  </article>
  } @empty {
  <h2>{{ dict['LIST_EMPTY_TITLE'] }}</h2>
  <p>{{ dict['LIST_EMPTY_HINT'] }}</p>
  }
<app-toolbar><a routerLink="/article/new">{{ dict['BTN_NEW_ARTICLE'] }}</a></app-toolbar>
</div>
}
