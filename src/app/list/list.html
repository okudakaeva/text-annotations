@if (initialized()) {
<div class="list">
<app-toolbar><a routerLink="/article/new">Создать статью</a></app-toolbar>
@for (article of articles(); track article.id) {
<article>
  <app-toolbar>
    <h2><a routerLink="/article/{{article.id}}">{{ article.title }}</a></h2>
    <div class="actions">
      <app-article-delete-button
        [article]="article"
        [refreshData]="loadArticles.bind(this)"
      />
      <app-article-edit-button [article]="article"/>
    </div>
  </app-toolbar>
</article>
} @empty {
<h2>Статей еще нет</h2>
<p>Создайте первую статью</p>
}
<app-toolbar><a routerLink="/article/new">Создать статью</a></app-toolbar>
</div>
}
