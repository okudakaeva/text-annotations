<div appTooltipContainer>
  <h1>{{  article().title }}</h1>
  <div [innerHTML]="article().text | safeHtmlWithAnnotations"></div>
</div>
<app-toolbar>
  <div class="links">
    <a routerLink="/">К списку статей</a>
    <a routerLink="/article/new">Создать статью</a>
  </div>

  <div class="actions">
    <app-article-delete-button [article]="article()" />
    <app-article-edit-button [article]="article()" />
  </div>
</app-toolbar>
