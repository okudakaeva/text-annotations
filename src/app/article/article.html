<div appTooltipContainer>
  <h1>{{  currentArticle().title }}</h1>
  <div
    appSelectionTracker
    [appArticleReadonlySync]="currentArticle()"
    (selectionDetected)="onSelectionDetected($event)"
    [innerHTML]="article().text | safeHtmlWithAnnotations"
  ></div>
</div>
<app-toolbar>
  <div class="links">
    <a routerLink="/">К списку статей</a>
    <a routerLink="/article/new">Создать статью</a>
  </div>

  <div class="actions">
    <app-article-delete-button [article]="currentArticle()"/>
    <app-article-edit-button [article]="currentArticle()"/>
  </div>
</app-toolbar>
<app-annotation-button/>
